<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - iAnctChinese</title>
    <link rel="stylesheet" href="../styles/login.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>iAnctChinese</h1>
                <p>古汉语智能标注平台</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i data-feather="user"></i>
                        用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="请输入用户名" 
                        required 
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i data-feather="lock"></i>
                        密码
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="请输入密码" 
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>记住我</span>
                    </label>
                </div>
                
                <button type="submit" class="login-btn" id="login-btn">
                    <span id="login-text">登录</span>
                    <span id="login-loading" style="display: none;">
                        <i data-feather="loader" class="spin"></i> 登录中...
                    </span>
                </button>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
            </form>
            
            <div class="login-footer">
                <p>还没有账号？<a href="register.html" class="register-link">立即注册</a></p>
                <p style="margin-top: 8px; font-size: 11px;">默认账号：zontiks / 123456</p>
            </div>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
    <script>
        // 初始化图标
        feather.replace();
        
        // 检查是否已登录
        if (localStorage.getItem('currentUser')) {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
